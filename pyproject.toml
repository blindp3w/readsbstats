[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "readsbstats"
version = "2.29.4"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.161.1",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
ui-tests = [
    "playwright>=1.64.1",
    "pytest-playwright>=0.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
norecursedirs = ["tests/ui", "tests/js", ".git", "__pycache__", ".venv", "venv"]
filterwarnings = [
    # starlette 1.x warns that its TestClient will require httpx2; the suite
    # (and fastapi.testclient itself) still imports it via httpx.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "ui: Playwright mobile smoke tests — run with: pytest tests/ui/ -v -m ui",
]

[tool.coverage.run]
source = ["readsbstats", "purge_ghosts", "purge_bad_gs", "purge_mlat_gs_spikes"]

[tool.coverage.report]
# The `sys.exit(main())` entry guards (collector, vdl2_collector, scripts) are
# only reachable via `python -m`, never from tests — exclude them from the
# denominator instead of pretending they're a coverage gap.
exclude_also = ["if __name__ == .__main__.:"]
