# Audit-13 A13-048: automated security/feature dependency bumps.
# Grouped weekly so the noise stays bounded. Manual review required on
# every PR — see CONTRIBUTING.md for the review checklist.
version: 2
updates:
  # First-party actions pinned to SHAs in .github/workflows/test.yml.
  # Dependabot tracks those pins and proposes bumps with the matching
  # tag comment refreshed.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python: FastAPI / uvicorn / httpx / jinja2 / aiofiles + dev
  # tooling. Bundled weekly so CVE fixes for the whole stack land in one
  # PR; we still bump major versions case-by-case.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Frontend: React / Vite / ECharts / Radix / TanStack. .npmrc pins the
  # public registry so Dependabot's resolved URLs are reproducible.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
    # TypeScript 7 (native compiler) is outside typescript-eslint 8's peer
    # range (`typescript <6.1`), so bundling it into the grouped PR breaks
    # `npm ci` with ERESOLVE (see v2.25.4). Stay on 6.x; drop this once
    # typescript-eslint supports 7. Minor/patch 6.x bumps still flow.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
